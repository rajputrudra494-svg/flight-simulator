<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1118" />
    <meta name="description" content="Strike Horizon - a browser combat flight simulator with procedural worlds and cities, 44 aircraft including the B-2 Spirit, SR-71 and A350, five cities, a 19-mission campaign and free flight." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Strike Horizon</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="gl"></canvas>
      <div id="fx-white" class="fx"></div>
      <div id="fx-red" class="fx"></div>
      <div id="fx-black" class="fx"></div>
      <canvas id="hud"></canvas>
      <div id="touch"></div>
      <div id="ui" class="ui"></div>
      <div id="fps"></div>
      <div id="loading">
        <svg class="load-jet" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 1.5l1.7 6 8 4.3v2l-8-1.8-.6 5.7 2.8 2.1v1.7L12 20.6l-3.9.9v-1.7l2.8-2.1-.6-5.7-8 1.8v-2l8-4.3z"/></svg>
        <div class="load-logo">STRIKE <span>HORIZON</span></div>
        <div id="loading-text">Starting engines…</div>
        <div class="load-track"><div id="loading-bar"></div></div>
        <div id="loading-tip"></div>
      </div>
      <noscript>This game needs JavaScript and WebGL 2.</noscript>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
